services:
  - type: web
    name: tempxral
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tempxral-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: tempxral-db
    databaseName: tempxral
    user: tempxral
    plan: free
