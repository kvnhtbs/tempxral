# Blueprint de Render — versión DE PAGO, reflejando lo que ya tienes activo
# manualmente en el panel (Starter + disco de 1GB + Postgres de pago). Si
# alguna vez se vuelve a sincronizar este archivo, esto evita que Render
# revierta tu plan a la versión gratuita sin avisar.

services:
  - type: web
    name: tempxral
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    disk:
      name: tempxral-uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tempxral-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: MODERATION_ENABLED
        value: "false"
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false

databases:
  - name: tempxral-db
    databaseName: tempxral
    user: tempxral
    plan: basic-256mb
