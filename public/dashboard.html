<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tempxral</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            padding: 0 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 0;
        }
        nav {
            background: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .nav-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: #f0f2f5;
        }
        .nav-links a.active {
            background: #007bff;
            color: white;
        }
        #user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        #user-menu span {
            font-weight: 500;
        }
        #logout-btn {
            cursor: pointer;
            color: #dc3545;
        }
        .dashboard-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #007bff;
        }
        .stat-card .label {
            color: #666;
            margin-top: 0.5rem;
        }
        .section-title {
            margin: 2rem 0 1rem 0;
            border-bottom: 2px solid #007bff;
            padding-bottom: 0.5rem;
        }
        .notifications-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }
        .notification-item {
            padding: 0.75rem;
            border-bottom: 1px solid #ddd;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item.unread {
            background: rgba(0, 123, 255, 0.1);
        }
        .notification-item .time {
            color: #999;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        .badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-links {
                flex-direction: column;
                gap: 0.5rem;
            }
            .nav-links a {
                text-align: center;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/" class="nav-brand">⏳ Tempxral</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/dashboard.html" class="active">📊 Dashboard</a>
                <div id="user-menu">
                    <span id="username-display"></span>
                    <a href="#" id="logout-btn">Cerrar sesión</a>
                </div>
            </div>
        </nav>

        <div class="dashboard-container">
            <h1>📊 Dashboard Personal</h1>
            <p id="user-info" style="color:#666;margin-bottom:1rem;"></p>

            <div id="notifications-section" style="margin-bottom: 2rem;">
                <h2>🔔 Notificaciones <span id="notification-badge" class="badge" style="display:none;">0</span></h2>
                <div id="notifications-list" class="notifications-list">
                    <div class="loading">Cargando notificaciones...</div>
                </div>
            </div>

            <div id="stats-section">
                <h2>📈 Estadísticas</h2>
                <div id="stats-grid" class="stats-grid">
                    <div class="loading" style="grid-column:1/-1;">Cargando estadísticas...</div>
                </div>
            </div>

            <div id="popular-posts">
                <h2 class="section-title">🔥 Publicaciones populares</h2>
                <div id="popular-posts-list">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
